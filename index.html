<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #8e24aa;
    --primary-light: #ab47bc;
    --accent: #ffb300;
    --bg-gradient: radial-gradient(circle at 50% 30%, #f3e5f5 0%, #d1c4e9 60%, #b39ddb 100%);
  }
  
  * { 
    box-sizing: border-box; 
    user-select: none; 
    -webkit-user-select: none; 
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body { 
    opacity: 0; 
    transition: opacity 0.4s ease-in; 
    font-family: 'Nunito', sans-serif; 
    background: var(--bg-gradient);
    overscroll-behavior: none;
    display: flex; 
    justify-content: center; 
    align-items: center; 
    position: relative;
    padding: env(safe-area-inset-top, 4px) env(safe-area-inset-right, 4px) env(safe-area-inset-bottom, 4px) env(safe-area-inset-left, 4px);
  }
  
  /* --- Чистая CSS Монетка (Работает на любых устройствах) --- */
  .coin-ico {
    display: inline-block;
    width: 14px; height: 14px;
    background: radial-gradient(circle at 30% 30%, #fff9c4 0%, #ffca28 50%, #f57f17 100%);
    border: 1.5px solid #e65100;
    border-radius: 50%;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.8), 0 1px 2px rgba(0,0,0,0.3);
    vertical-align: middle;
    margin: 0 2px;
  }
  .coin-badge .coin-ico { width: 18px; height: 18px; border-width: 2px; }

  .bg-bubble {
    position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none; z-index: 0; animation: floatUpBackground linear infinite;
  }
  @keyframes floatUpBackground { 0% { transform: translateY(105vh) scale(0.6); opacity: 0; } 40% { opacity: 0.7; } 100% { transform: translateY(-15vh) scale(1.4); opacity: 0; } }

  #game-wrapper {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 8px 10px; border-radius: 20px;
    box-shadow: 0 10px 40px rgba(58, 28, 120, 0.2), 0 0 0 2px rgba(255,255,255,0.7) inset; 
    width: 100%; height: 100%; max-width: 1300px;
    position: relative; overflow: hidden; z-index: 10;
  }

  #settings-panel { position: absolute; top: 8px; right: 10px; z-index: 9999; display: flex; gap: 6px; }
  .setting-btn {
    background: #ffffff; border: 2px solid #ce93d8; border-radius: 50%;
    width: 36px; height: 36px; font-size: 16px; cursor: pointer; transition: 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex; justify-content: center; align-items: center; box-shadow: 0 3px 8px rgba(106, 27, 154, 0.15); color: #4a148c;
  }
  .setting-btn:active { transform: scale(0.9); }

  #main-menu {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; position: absolute; top: 0; left: 0;
    background: radial-gradient(circle at center, #fbf7fc 0%, #e1bee7 100%); border-radius: 20px; z-index: 100;
    padding: 20px;
  }
  
  #main-menu h1 {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(34px, 8vw, 60px); 
    margin: 0 0 12px 0; text-align: center; line-height: 1.1; letter-spacing: 1px;
    background: linear-gradient(180deg, #fffde7 0%, #ffd54f 30%, #ff9800 65%, #f44336 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 2px #ffffff;
    filter: drop-shadow(0px 6px 0px #ad1457) drop-shadow(0px 10px 16px rgba(173, 20, 87, 0.4));
    animation: floatTitle 3s ease-in-out infinite alternate;
  }
  @keyframes floatTitle { 0% { transform: translateY(0) scale(1) rotate(-1deg); } 100% { transform: translateY(-6px) scale(1.03) rotate(1deg); } }
  
  .top-stats-bar { display: flex; gap: 12px; margin-bottom: 16px; }
  .coin-badge { background: #fff8e1; border: 2px solid #ffb300; border-radius: 16px; padding: 4px 14px; font-weight: 800; color: #ff8f00; font-size: 16px; display: flex; align-items: center; gap: 4px; box-shadow: 0 3px 8px rgba(255, 179, 0, 0.2); }
  
  .menu-btn {
    background: linear-gradient(180deg, #66bb6a 0%, #43a047 100%); color: white; border: none; padding: 12px 28px;
    border-radius: 18px; font-size: clamp(15px, 4.5vw, 19px); cursor: pointer; transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 6px 0 #2e7d32, 0 10px 16px rgba(46, 125, 50, 0.3); font-family: 'Nunito', sans-serif; font-weight: 900; 
    margin-bottom: 10px; width: 88%; max-width: 280px; text-transform: uppercase; letter-spacing: 1px;
  }
  .menu-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #2e7d32; }
  .btn-house-menu { background: linear-gradient(180deg, #ffb74d 0%, #fb8c00 100%); box-shadow: 0 6px 0 #e65100; font-size: 16px; text-transform: none; }
  .btn-house-menu:active { box-shadow: 0 1px 0 #e65100; }
  .btn-daily-menu { background: linear-gradient(180deg, #ba68c8 0%, #8e24aa 100%); box-shadow: 0 6px 0 #4a148c; font-size: 15px; text-transform: none; }
  .btn-daily-menu:active { box-shadow: 0 1px 0 #4a148c; }
  .btn-reset-menu { background: linear-gradient(180deg, #b0bec5 0%, #78909c 100%); box-shadow: 0 4px 0 #455a64; font-size: 12px; margin-top: 8px; text-transform: none; max-width: 200px; padding: 6px 14px; }

  #game-ui { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
  
  #header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 6px; flex-shrink: 0; gap: 4px; flex-wrap: wrap; padding-right: 46px; }
  .stats-badge { background: #ffffff; padding: 4px 10px; border-radius: 10px; font-weight: 800; color: #4a148c; font-size: 13px; box-shadow: 0 2px 6px rgba(74, 20, 140, 0.08); border: 1px solid #e1bee7; white-space: nowrap; }
  #ui-panel { display: flex; gap: 4px; justify-content: flex-start; flex-wrap: wrap; }
  .btn { color: white; border: none; padding: 6px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; transition: 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-family: 'Nunito', sans-serif; font-weight: 900; text-align: center; white-space: nowrap; text-shadow: 1px 1px 1px rgba(0,0,0,0.25); }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 transparent !important; }
  
  #board-viewport { flex-grow: 1; width: 100%; height: calc(100% - 70px); border: 3px solid #7e57c2; background: radial-gradient(circle at 50% 40%, #5c6bc0 0%, #3949ab 60%, #283593 100%); border-radius: 16px; display: flex; justify-content: center; align-items: center; overflow: hidden; box-shadow: inset 0 4px 20px rgba(0,0,0,0.4); position: relative; }
  #board-viewport::before { content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%; background: repeating-conic-gradient(from 0deg, transparent 0deg 15deg, rgba(255,255,255,0.025) 15deg 30deg); animation: rotateBg 140s linear infinite; pointer-events: none; z-index: 0; }
  @keyframes rotateBg { 100% { transform: rotate(360deg); } }
  
  #mahjong-container { position: absolute; left: 0; top: 0; transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); transform-origin: 0 0; z-index: 1; }
  
  .tile { 
    position: absolute; width: 84px; height: 102px; 
    background: linear-gradient(180deg, #ffffff 0%, #faf6ee 85%, #ede4d3 100%);
    border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; 
    transition: transform 0.16s ease, filter 0.2s ease, box-shadow 0.16s ease; box-sizing: border-box;
    box-shadow: 0 1px 0 #d7cbba, 0 2px 0 #cbbea9, 0 3px 0 #beaf99, 0 4px 0 #b1a189, 0 5px 0 #a49279, 0 6px 0 #958369, 0 8px 12px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.9);
  }
  .tile::after { content: ''; position: absolute; top: 4px; bottom: 4px; left: 4px; right: 4px; border: 1.5px solid rgba(206, 147, 216, 0.4); border-radius: 8px; pointer-events: none; }

  .tile.gold-tile {
    background: linear-gradient(180deg, #fffde7 0%, #fff9c4 40%, #ffe082 100%) !important;
    border: 2px solid #ffd54f !important;
    box-shadow: 0 1px 0 #ffca28, 0 3px 0 #ffb300, 0 5px 0 #ffa000, 0 6px 0 #ff8f00, 0 10px 18px rgba(255, 179, 0, 0.6), 0 0 15px rgba(255, 235, 59, 0.8) !important;
    animation: goldShimmer 2s infinite alternate;
  }
  .tile.gold-tile::after { border-color: rgba(255, 215, 0, 0.9) !important; }
  @keyframes goldShimmer { 0% { filter: drop-shadow(0 0 4px #ffeb3b); } 100% { filter: drop-shadow(0 0 12px #ff9800); } }
  
  @keyframes dealTile { 0% { transform: translateY(-200px) scale(1.2); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  .tile.dealing { animation: dealTile 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
  .tile svg { width: 72%; height: 72%; filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.22)); position: relative; z-index: 1; }
  
  .tile.selected { 
    background: linear-gradient(180deg, #fffde7 0%, #fff9c4 100%);
    transform: translateY(-6px) scale(1.02); z-index: 1000 !important;
    box-shadow: 0 1px 0 #ffe082, 0 3px 0 #ffd54f, 0 5px 0 #ffca28, 0 7px 0 #ffb300, 0 12px 18px rgba(255, 179, 0, 0.45), 0 0 16px rgba(255, 235, 59, 0.6);
    border-color: #fff59d;
  }
  .tile.selected::after { border-color: rgba(255, 179, 0, 0.7); }
  
  .tile.blocked { filter: brightness(0.65) contrast(1.05); cursor: default; box-shadow: 0 4px 0 #736551, 0 5px 8px rgba(0,0,0,0.35); }
  .tile.hinted { animation: hintGlow 0.6s infinite alternate !important; z-index: 3000 !important; }
  @keyframes hintGlow { 0% { transform: translateY(0); filter: brightness(1); } 100% { transform: translateY(-6px); filter: brightness(1.2); box-shadow: 0 7px 0 #ffca28, 0 0 20px #ffeb3b; } }
  
  .floating-score { position: absolute; font-family: 'Fredoka', sans-serif; font-size: 32px; color: #fff; -webkit-text-stroke: 2px #f57f17; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4)); z-index: 4000; pointer-events: none; animation: floatScore 1s ease-out forwards; }
  @keyframes floatScore { 0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; } 25% { transform: translate(-50%, -15px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }

  #mascot-container { position: absolute; bottom: 6px; right: 8px; z-index: 5000; display: flex; flex-direction: column; align-items: center; pointer-events: none; transform: scale(0.85); transform-origin: bottom right; }
  #mascot-wrapper { position: relative; pointer-events: auto; cursor: pointer; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35)); }
  #mascot-fruit-slot { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%) scale(0); width: 44px; height: 44px; z-index: 10; transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  #mascot-fruit-slot.eating { transform: translateX(-50%) scale(1.15); }
  
  .mascot-idle { animation: mascotHover 3s ease-in-out infinite alternate; }
  .mascot-jump { animation: mascotJump 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .mascot-sad { animation: mascotShake 0.4s ease-in-out; }
  .mascot-eat { animation: mascotChew 0.25s ease-in-out infinite alternate; }
  @keyframes mascotHover { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
  @keyframes mascotJump { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-24px) scale(0.92, 1.08); } }
  @keyframes mascotShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-4deg); } 75% { transform: translateX(4px) rotate(4deg); } }
  @keyframes mascotChew { 0% { transform: scale(1, 1); } 100% { transform: scale(1.06, 0.94); } }
  
  .speech-bubble { background: #ffffff; border-radius: 14px; padding: 4px 10px; font-weight: 800; color: #4a148c; font-size: 13px; box-shadow: 0 3px 10px rgba(0,0,0,0.2); margin-bottom: 6px; text-align: center; position: relative; opacity: 0; transform: translateY(6px) scale(0.85); transition: all 0.2s cubic-bezier(0.3, 1.5, 0.5, 1); border: 1.5px solid #ba68c8; }
  .speech-bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 6px 0; border-style: solid; border-color: #ba68c8 transparent transparent transparent; }
  .speech-bubble.show { opacity: 1; transform: translateY(0) scale(1); }
  
  .combo-text { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: 'Fredoka', sans-serif; font-size: 36px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 3px 0 #ad1457, 0 8px 20px rgba(0,0,0,0.5); pointer-events: none; z-index: 9999; animation: floatUpFade 1.1s forwards; }
  @keyframes floatUpFade { 0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; } 25% { transform: translate(-50%, -20px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }
  
  /* --- ДОМИК ЮМИ --- */
  #house-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 30%, #fff8e1 0%, #ffe0b2 100%); border-radius: 20px; z-index: 150; flex-direction: column; align-items: center; padding: 12px; }
  #house-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 700px; margin-bottom: 8px; }
  #room-stage { flex-grow: 1; width: 100%; max-width: 700px; max-height: 380px; background: #fff; border: 4px solid #d7ccc8; border-radius: 20px; position: relative; overflow: hidden; box-shadow: inset 0 0 30px rgba(141, 110, 99, 0.2), 0 8px 20px rgba(0,0,0,0.1); }
  .room-wall { position: absolute; top: 0; left: 0; width: 100%; height: 65%; background: linear-gradient(180deg, #fbe9e7 0%, #ffccbc 100%); border-bottom: 6px solid #bcaaa4; }
  .room-floor { position: absolute; bottom: 0; left: 0; width: 100%; height: 35%; background: repeating-linear-gradient(90deg, #d7ccc8, #d7ccc8 30px, #bcaaa4 31px, #bcaaa4 32px); }
  .room-item { position: absolute; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
  .item-hidden { display: none !important; }
  #shop-carousel { width: 100%; max-width: 700px; display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px; margin-top: 6px; scrollbar-width: none; -ms-overflow-style: none; }
  #shop-carousel::-webkit-scrollbar { display: none; }
  .shop-card { flex: 0 0 115px; background: #ffffff; border: 2px solid #ffcc80; border-radius: 14px; padding: 6px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 3px 8px rgba(0,0,0,0.06); }
  .shop-card-icon { height: 36px; margin-bottom: 4px; display: flex; justify-content: center; align-items: center; }
  .shop-card-title { font-size: 11px; font-weight: 800; color: #5d4037; margin-bottom: 4px; }
  .buy-btn { background: linear-gradient(180deg, #ffb300 0%, #f57c00 100%); color: #fff; border: none; border-radius: 10px; padding: 4px 10px; font-size: 12px; font-weight: 900; cursor: pointer; box-shadow: 0 2px 0 #e65100; }
  .buy-btn:disabled { background: #b0bec5; box-shadow: none; cursor: default; }

  #victory-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 18, 65, 0.88); backdrop-filter: blur(6px); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; }
  .victory-card { background: #ffffff; padding: 24px 28px; border-radius: 24px; text-align: center; box-shadow: 0 16px 45px rgba(0,0,0,0.5), 0 0 0 2px #ede7f6 inset; max-width: 320px; width: 90%; animation: popText 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .victory-card h2 { font-family: 'Fredoka', sans-serif; font-weight: 700; color: #4a148c; margin: 0 0 8px 0; font-size: 26px; }
  .stars-row { font-size: 40px; margin: 8px 0 14px; letter-spacing: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
  @keyframes popText { 0%{transform:scale(0.6); opacity:0;} 70%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;} }
  @keyframes confettiFall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(900deg); opacity: 0; } }
  .hidden { display: none !important; }
</style>
<script type="text/javascript" src="https://play.vk.com/sdk/v1/vkp.js"></script>
</head>
<body>
<div id="bg-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; overflow:hidden; z-index:-1;"></div>

<div id="game-wrapper">
  <div id="settings-panel">
    <button id="btn-sfx" class="setting-btn" onclick="toggleSfx()" title="Звуки">🔊</button>
  </div>
  
  <div id="main-menu">
    <h1>Фруктовый<br>Маджонг</h1>
    <div class="top-stats-bar">
      <div id="menu-level" style="margin-bottom:0;">Уровень: 1</div>
      <div class="coin-badge"><div class="coin-ico"></div> <span id="menu-coins">0</span></div>
    </div>
    <button class="menu-btn" onclick="startGame()">▶ ИГРАТЬ</button>
    <button class="menu-btn btn-house-menu" onclick="openHouse()">Домик Юми</button>
    <button class="menu-btn btn-daily-menu" onclick="showDaily()">Ежедневный бонус</button>
    <button class="menu-btn btn-reset-menu" onclick="resetProgress()">Сбросить прогресс</button>
  </div>
  
  <div id="house-screen">
    <div id="house-header">
      <div class="coin-badge" style="font-size:18px;"><div class="coin-ico"></div> <span id="house-coins">0</span></div>
      <button class="btn" style="background:#ba68c8; box-shadow:0 3px 0 #7b1fa2;" onclick="closeHouse()">◀ Назад</button>
    </div>
    <div id="room-stage">
      <div class="room-wall"></div><div class="room-floor"></div>
      <div id="fur-window" class="room-item item-hidden" style="top:10px; left:40px;"><svg viewBox="0 0 100 100" width="70" height="70"><rect x="5" y="5" width="90" height="90" fill="#e1f5fe" stroke="#8d6e63" stroke-width="6"/><line x1="50" y1="5" x2="50" y2="95" stroke="#8d6e63" stroke-width="6"/><line x1="5" y1="50" x2="95" y2="50" stroke="#8d6e63" stroke-width="6"/><circle cx="75" cy="25" r="12" fill="#ffca28"/></svg></div>
      <div id="fur-art" class="room-item item-hidden" style="top:20px; right:50px;"><svg viewBox="0 0 100 100" width="50" height="50"><rect x="10" y="15" width="80" height="70" fill="#bbdefb" stroke="#ffb300" stroke-width="6"/><circle cx="70" cy="40" r="10" fill="#ffea00"/><path d="M10 85 L40 50 L65 75 L75 60 L90 85 Z" fill="#8bc34a"/></svg></div>
      <div id="fur-lamp" class="room-item item-hidden" style="bottom:60px; left:20px;"><svg viewBox="0 0 100 100" width="40" height="80"><line x1="50" y1="90" x2="50" y2="40" stroke="#5d4037" stroke-width="6"/><path d="M25 40 L75 40 L60 10 L40 10 Z" fill="#ffeb3b" stroke="#fbc02d" stroke-width="2"/><line x1="25" y1="90" x2="75" y2="90" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/></svg></div>
      <div id="fur-plant" class="room-item item-hidden" style="bottom:50px; right:20px;"><svg viewBox="0 0 100 100" width="50" height="60"><path d="M45 80 L40 20 M55 80 L60 30" stroke="#8bc34a" stroke-width="6" stroke-linecap="round"/><path d="M40 35 Q30 25 20 35 M60 45 Q75 35 85 45 M43 25 Q35 15 25 20" stroke="#4caf50" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M30 75 L70 75 L60 100 L40 100 Z" fill="#795548"/></svg></div>
      <div id="fur-carpet" class="room-item item-hidden" style="bottom:10px; left:50%; transform:translateX(-50%);"><svg viewBox="0 0 100 40" width="160" height="60"><ellipse cx="50" cy="20" rx="48" ry="18" fill="#ce93d8" stroke="#ab47bc" stroke-width="3"/><ellipse cx="50" cy="20" rx="35" ry="10" fill="#e1bee7"/></svg></div>

  function makeSolvable(targetTilesArray, rngFunc) {
      let typeCounts = {}; targetTilesArray.forEach(t => typeCounts[t.type] = (typeCounts[t.type] || 0) + 1);
      let fruitPairs = []; for (let t in typeCounts) { let count = Math.floor(typeCounts[t] / 2); for(let i=0; i<count; i++) fruitPairs.push(parseInt(t)); }
      shuffleArray(fruitPairs, rngFunc);
      let bestPairs = []; let minLeftovers = Infinity;

      for(let attempt=0; attempt<20; attempt++) {
          let simTiles = targetTilesArray.map(t => ({ id: t.id, x: t.x, y: t.y, z: t.z, active: true }));
          let currentPairs = []; let stuck = false;
          function simIsFree(tile) {
              if (simTiles.some(t => t.active && t.x === tile.x && t.y === tile.y && t.z > tile.z)) return false;
              let hasLeft = simTiles.some(t => t.active && t.y === tile.y && t.z === tile.z && t.x === tile.x - 1);
              let hasRight = simTiles.some(t => t.active && t.y === tile.y && t.z === tile.z && t.x === tile.x + 1);
              return !(hasLeft && hasRight);
          }
          while (simTiles.some(t => t.active)) {
              let freeTiles = simTiles.filter(t => t.active && simIsFree(t));
              if (freeTiles.length < 2) { stuck = true; break; }
              shuffleArray(freeTiles, rngFunc); freeTiles[0].active = false; freeTiles[1].active = false; currentPairs.push([freeTiles[0].id, freeTiles[1].id]);
          }
          if (!stuck) { bestPairs = currentPairs; minLeftovers = 0; break; } 
          else {
              let activeCount = simTiles.filter(t => t.active).length;
              if (activeCount < minLeftovers) { minLeftovers = activeCount; bestPairs = [...currentPairs]; let leftovers = simTiles.filter(t => t.active); for(let i=0; i<leftovers.length; i+=2) { if (leftovers[i+1]) bestPairs.push([leftovers[i].id, leftovers[i+1].id]); } }
          }
      }
      bestPairs.forEach((pair, index) => {
          let fType = fruitPairs[index] !== undefined ? fruitPairs[index] : fruitPairs[0];
          let t1 = targetTilesArray.find(t => t.id === pair[0]); let t2 = targetTilesArray.find(t => t.id === pair[1]);
          if(t1 && t2) { t1.type = fType; t2.type = fType; }
      });
  }

  function fixVerticalDuplicates(targetTilesArray, rngFunc) {
    let maxAttempts = 1000, attempt = 0, conflict = true;
    while (conflict && attempt < maxAttempts) {
      conflict = false; attempt++;
      for (let i = 0; i < targetTilesArray.length; i++) {
        let t = targetTilesArray[i]; if (!t.active) continue;
        let sameBelow = targetTilesArray.find(b => b.active && b.x === t.x && b.y === t.y && b.z < t.z && b.type === t.type);
        if (sameBelow) {
          conflict = true; let cands = targetTilesArray.filter(c => c.active && c.type !== t.type && (c.x !== t.x || c.y !== t.y));
          if (cands.length > 0) { let cand = cands[Math.floor(rngFunc() * cands.length)]; let temp = t.type; t.type = cand.type; cand.type = temp; }
          break;
        }
      }
    }
  }

  function countAvailablePairs() { let freeTiles = tiles.filter(t => t.active && isFree(t)); let counts = {}; freeTiles.forEach(t => counts[t.type] = (counts[t.type] || 0) + 1); let pairs = 0; for(let k in counts) pairs += Math.floor(counts[k] / 2); return pairs; }

  function initLevel() {
    selectedId = null; currentCombo = 0; moveHistory = []; updateInventoryUI();
    let rng = getSeededRandom(currentLevel); let diff = Math.floor((currentLevel - 1) / 10); 
    let tmpl = shapes[Math.floor(rng() * shapes.length)];
    let baseMap = tmpl.getMap(); gridWidth = baseMap[0].length; gridHeight = baseMap.length; document.getElementById('level-display').innerText = `Ур: ${currentLevel}`;
    
    let layout = [];
    for(let y=0; y<gridHeight; y++) { for(let x=0; x<gridWidth; x++) { if(baseMap[y][x] === '#') layout.push([x, y, 0]); } }
    
    let maxZ = Math.min(3 + Math.floor(diff / 2), 6);
    
    for (let z = 1; z < maxZ; z++) {
      let layer = [];
      for(let y=0; y<gridHeight; y++) {
        for(let x=0; x<gridWidth; x++) {
          let isFirstHalf = (tmpl.sym === 'mirror') ? (x < Math.ceil(gridWidth / 2)) : (y < Math.floor(gridHeight / 2) || (gridHeight%2!==0 && y===Math.floor(gridHeight/2) && x < Math.ceil(gridWidth/2)));
          let symX = (tmpl.sym === 'mirror') ? gridWidth - 1 - x : gridWidth - 1 - x;
          let symY = (tmpl.sym === 'mirror') ? y : gridHeight - 1 - y;
          if (isFirstHalf && layout.some(t=>t[0]===x&&t[1]===y&&t[2]===z-1) && layout.some(t=>t[0]===symX&&t[1]===symY&&t[2]===z-1) && rng() < (1.0 - z * 0.15)) {
            layer.push([x, y, z]); 
            if (x !== symX || y !== symY) layer.push([symX, symY, z]);
          }
        }
      }
      layout.push(...layer);
    }
    if (layout.length % 2 !== 0) layout.pop(); 
    
    let numF = Math.min(6 + Math.floor((currentLevel - 1) / 2), svgs.length - 1);
    let avail = Array.from({length: numF}, (_, i) => i + 1); 
    
    let totalPairs = layout.length / 2;
    let types = [];
    
    let hasGold = (currentLevel > 1 && rng() < 0.35 && totalPairs >= 4);
    if(hasGold) {
        types.push(0, 0); 
        for(let i = 1; i < totalPairs; i++) types.push(avail[i % numF], avail[i % numF]);
    } else {
        for(let i = 0; i < totalPairs; i++) types.push(avail[i % numF], avail[i % numF]);
    }
    shuffleArray(types, rng);

    tiles = layout.map((pos, i) => ({ id: i, x: pos[0], y: pos[1], z: pos[2], type: types[i], active: true }));
    makeSolvable(tiles, rng); fixVerticalDuplicates(tiles, rng); render(); triggerMascot('idle');
  }

  function isFree(tile) {
    if (tiles.some(t => t.active && t.x === tile.x && t.y === tile.y && t.z > tile.z)) return false;
    let hasLeft = tiles.some(t => t.active && t.y === tile.y && t.z === tile.z && t.x === tile.x - 1);
    let hasRight = tiles.some(t => t.active && t.y === tile.y && t.z === tile.z && t.x === tile.x + 1);
    return !(hasLeft && hasRight);
  }

  function scaleBoard() {
    let view = document.getElementById('board-viewport'); 
    let cont = document.getElementById('mahjong-container');
    if (!view || !cont) return;
    
    let viewW = view.clientWidth; 
    let viewH = view.clientHeight; 
    if (viewW < 50 || viewH < 50) return;
    
    let boardW = gridWidth * 86 + 34; 
    let boardH = gridHeight * 104 + 33; 
    
    let scaleX = (viewW * 0.98) / boardW; 
    let scaleY = (viewH * 0.98) / boardH; 
    let s = Math.min(scaleX, scaleY);
    
    if (s > 2.8) s = 2.8; 
    if (s < 0.2) s = 0.2; 
    
    let offsetX = (viewW - (boardW * s)) / 2;
    let offsetY = (viewH - (boardH * s)) / 2;
    
    cont.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${s})`;
  }

  window.addEventListener('resize', scaleBoard); window.addEventListener('orientationchange', () => setTimeout(scaleBoard, 150));

        let mx = (l1 + l2) / 2, my = (t1 + t2) / 2; let r1 = selEl.getBoundingClientRect(); let r2 = el.getBoundingClientRect();
        selEl.animate([{ transform: 'translate(0px, 0px) scale(1) rotate(0deg)', opacity: 1, filter: 'brightness(1)' }, { transform: `translate(${mx - l1}px, ${my - t1}px) scale(1.15) rotate(10deg)`, opacity: 1, filter: 'brightness(1.4) drop-shadow(0 0 15px #fff)', offset: 0.5 }, { transform: `translate(${mx - l1}px, ${my - t1}px) scale(0) rotate(18deg)`, opacity: 0, filter: 'brightness(1.8)' }], {duration: 320, easing: 'ease-in-out', fill: 'forwards'});
        el.animate([{ transform: 'translate(0px, 0px) scale(1) rotate(0deg)', opacity: 1, filter: 'brightness(1)' }, { transform: `translate(${mx - l2}px, ${my - t2}px) scale(1.15) rotate(-10deg)`, opacity: 1, filter: 'brightness(1.4) drop-shadow(0 0 15px #fff)', offset: 0.5 }, { transform: `translate(${mx - l2}px, ${my - t2}px) scale(0) rotate(-18deg)`, opacity: 0, filter: 'brightness(1.8)' }], {duration: 320, easing: 'ease-in-out', fill: 'forwards'});
        moveHistory.push([selTile.id, tile.id]); handleCombo(tile.type, r1, r2); selectedId = null; setTimeout(() => { updateState(); window.checkWin(); }, 320);
      } else { selEl.classList.remove('selected'); selectedId = id; el.classList.add('selected'); window.sfx.click(); }
    }
  };

  window.useUndo = function() { resetHunger(); if(moveHistory.length === 0) { triggerMascot('sad', 'Нечего отменять!'); window.sfx.error(); return; } if(undos <= 0) { triggerMascot('sad', 'Нет отмен!'); window.sfx.error(); return; } undos--; updateInventoryUI(); let lastPair = moveHistory.pop(); let t1 = tiles.find(t => t.id === lastPair[0]); let t2 = tiles.find(t => t.id === lastPair[1]); if(t1 && t2) { t1.active = true; t2.active = true; let el1 = document.getElementById('tile-' + t1.id); let el2 = document.getElementById('tile-' + t2.id); if(el1) { el1.getAnimations().forEach(a => a.cancel()); el1.style.pointerEvents = 'auto'; el1.style.zIndex = t1.z * 10; } if(el2) { el2.getAnimations().forEach(a => a.cancel()); el2.style.pointerEvents = 'auto'; el2.style.zIndex = t2.z * 10; } } window.sfx.undo(); triggerMascot('happy', 'Вернули!'); selectedId = null; setTimeout(updateState, 10); };
  window.useHint = function() { resetHunger(); if (hints <= 0) { triggerMascot('sad', 'Нет подсказок!'); window.sfx.error(); return; } let fT = tiles.filter(t => t.active && isFree(t)); for(let i=0; i<fT.length; i++) { for(let j=i+1; j<fT.length; j++) { if(fT[i].type === fT[j].type) { document.getElementById('tile-'+fT[i].id).classList.add('hinted'); document.getElementById('tile-'+fT[j].id).classList.add('hinted'); hints--; updateInventoryUI(); triggerMascot('happy', 'Смотри сюда!'); window.sfx.hint(); return; } } } triggerMascot('sad', 'Нет пар! Перемешай!'); window.sfx.error(); };
  window.useShuffle = function() { resetHunger(); if (shuffles <= 0) { triggerMascot('sad', 'Пусто!'); window.sfx.error(); return; } shuffles--; updateInventoryUI(); let activeTiles = tiles.filter(t => t.active); let types = activeTiles.map(t => t.type); shuffleArray(types, Math.random); activeTiles.forEach((t, i) => t.type = types[i]); makeSolvable(activeTiles, Math.random); fixVerticalDuplicates(activeTiles, Math.random); selectedId = null; render(); triggerMascot('happy', 'Вжух!'); window.sfx.shuffle(); };
  
  window.checkWin = function() { if (tiles.every(t => !t.active)) { clearTimeout(hungerTimer); coins += 10; updateCoinsUI(); window.sfx.win(); triggerMascot('happy', 'ПОБЕДА! +10 <div class="coin-ico"></div>'); launchCelebration(); setTimeout(() => { let stars = currentScore >= 1400 ? "⭐⭐⭐" : (currentScore >= 700 ? "⭐⭐" : "⭐"); document.getElementById('victory-stars').innerText = stars; document.getElementById('victory-score-text').innerHTML = `Набрано очков: ${currentScore} (+10 <div class="coin-ico"></div>)`; document.getElementById('victory-overlay').style.display = 'flex'; }, 1300); } };
  window.nextLevel = function() { document.getElementById('victory-overlay').style.display = 'none'; currentLevel++; sSet('mj_lvl_v11', currentLevel); updateMenuDisplay(); initLevel(); };
  
  window.showHintAd = function() { clearTimeout(hungerTimer); if (vkPlayApp) { try { vkPlayApp.showAds({ interstitial: false, rewarded: true, callbacks: { onReward: ()=>{ hints+=2; updateInventoryUI(); triggerMascot('happy', 'Ура, бонусы!'); }, onClose: resetHunger, onError: ()=>{ triggerMascot('sad', 'Нет рекламы :('); resetHunger(); } } }); } catch(e) {} } else { let ov = document.getElementById('ad-overlay'); let t = document.getElementById('ad-timer'); ov.style.display = 'flex'; let tl = 3; t.innerText = tl; let int = setInterval(() => { tl--; t.innerText = tl; if (tl <= 0) { clearInterval(int); ov.style.display = 'none'; hints += 2; updateInventoryUI(); triggerMascot('happy', 'Бонусы!'); resetHunger(); } }, 1000); } };
  window.showShuffleAd = function() { clearTimeout(hungerTimer); if (vkPlayApp) { try { vkPlayApp.showAds({ interstitial: false, rewarded: true, callbacks: { onReward: ()=>{ shuffles+=1; updateInventoryUI(); triggerMascot('happy', 'Перемешивание!'); }, onClose: resetHunger, onError: ()=>{ triggerMascot('sad', 'Нет рекламы :('); resetHunger(); } } }); } catch(e) {} } else { let ov = document.getElementById('ad-overlay'); let t = document.getElementById('ad-timer'); ov.style.display = 'flex'; let tl = 3; t.innerText = tl; let int = setInterval(() => { tl--; t.innerText = tl; if (tl <= 0) { clearInterval(int); ov.style.display = 'none'; shuffles += 1; updateInventoryUI(); triggerMascot('happy', 'Перемешивание получено!'); resetHunger(); } }, 1000); } };
</script>
